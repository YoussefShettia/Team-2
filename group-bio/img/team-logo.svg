<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b3d2a"/>
      <stop offset="1" stop-color="#05261a"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8c766"/>
      <stop offset="1" stop-color="#b8922e"/>
    </linearGradient>
    <clipPath id="inner">
      <circle cx="200" cy="200" r="168"/>
    </clipPath>
  </defs>

  <!-- Badge -->
  <circle cx="200" cy="200" r="190" fill="url(#gold)"/>
  <circle cx="200" cy="200" r="178" fill="#05261a"/>
  <circle cx="200" cy="200" r="168" fill="url(#sky)"/>

  <g clip-path="url(#inner)">
    <!-- Faint code lines in the sky -->
    <g font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#1f6b4a" opacity="0.55">
      <text x="48" y="70">def build(team):</text>
      <text x="62" y="86">return ship(team)</text>
      <text x="230" y="64">01001110 01001001</text>
      <text x="250" y="80">while True:</text>
      <text x="262" y="96">learn()</text>
    </g>

    <!-- Code brackets -->
    <text x="200" y="168" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-weight="700" font-size="84" fill="url(#gold)">&lt;/&gt;</text>

    <!-- Generic city skyline -->
    <g fill="#e8c766">
      <rect x="30" y="262" width="34" height="140"/>
      <rect x="68" y="240" width="26" height="160"/>
      <rect x="98" y="276" width="30" height="130"/>
      <rect x="132" y="226" width="30" height="180"/>
      <polygon points="166,212 182,196 198,212 198,400 166,400"/>
      <rect x="202" y="230" width="28" height="170"/>
      <rect x="234" y="250" width="34" height="150"/>
      <polygon points="272,236 288,222 304,236 304,400 272,400"/>
      <rect x="308" y="266" width="28" height="140"/>
      <rect x="340" y="282" width="34" height="120"/>
    </g>
    <!-- Lit windows -->
    <g fill="#0b3d2a" opacity="0.8">
      <rect x="140" y="240" width="5" height="6"/><rect x="150" y="240" width="5" height="6"/>
      <rect x="140" y="256" width="5" height="6"/><rect x="150" y="270" width="5" height="6"/>
      <rect x="176" y="224" width="5" height="6"/><rect x="186" y="238" width="5" height="6"/>
      <rect x="210" y="244" width="5" height="6"/><rect x="220" y="258" width="5" height="6"/>
      <rect x="280" y="248" width="5" height="6"/><rect x="292" y="262" width="5" height="6"/>
      <rect x="76" y="254" width="5" height="6"/><rect x="242" y="264" width="5" height="6"/>
    </g>

    <!-- Banner -->
    <rect x="0" y="300" width="400" height="70" fill="#05261a"/>
    <rect x="0" y="300" width="400" height="3" fill="url(#gold)"/>
    <text x="200" y="338" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="30" letter-spacing="4" fill="#ffffff">TEAM 2</text>
    <text x="200" y="358" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="3" fill="#e8c766">CODE · BUILD · SHIP</text>
  </g>
</svg>
